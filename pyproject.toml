[project]
name = "odd-number-forensics"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Run odd/even prompting experiments against local Ollama models and evaluate parity outcomes."
readme = "README.md"
authors = [
    { name = "Aman Kumar Singh", email = "amankumarsingh.professional@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "openai>=1.0.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
odd-number-forensics = "odd_number_forensics.main:main"
generate_dataset = "odd_number_forensics.scripts.generate_dataset:main"
validate_generators = "odd_number_forensics.scripts.validate_generators:main"
re_evaluate = "odd_number_forensics.scripts.re_evaluate:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [".env", ".env.*"]
